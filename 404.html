.swing{transform-box:fill-box;transform-origin:100% 100%;animation:topple 1.1s linear .6s both}

h1{font:700 clamp(48px,13vw,72px)/.9 'MOB Cn','Arial Narrow',sans-serif;text-transform:uppercase;margin:0}
p{margin:0;color:var(--ink-2)}
a.btn{margin-top:6px;font:700 20px/1 'MOB Cn','Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.01em;background:var(--ink);color:var(--paper);text-decoration:none;border-radius:4px;padding:15px 22px;min-height:48px;display:inline-flex;align-items:center;box-shadow:4px 4px 0 var(--accent);transition:transform .12s ease,box-shadow .12s ease}
a.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--accent)}
a.btn:focus-visible{outline:3px solid var(--deep);outline-offset:3px}
::selection{background:var(--accent);color:var(--paper)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){main,.swing{animation:none}.swing{transform:rotate(90deg)}}
